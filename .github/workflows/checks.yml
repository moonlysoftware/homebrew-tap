name: Tap checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tap-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Formula and manifest checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check formula syntax and pinned metadata
        run: |
          ruby -c Formula/dkc.rb
          python3 scripts/check.py
      - name: Test release pins and archive verification
        run: python3 -m unittest discover -s tests -v
      - name: Record scope
        run: |
          echo 'Offline formula, manifest and helper checks. Native install/upgrade and anonymous public downloads require separate validation.' >> "$GITHUB_STEP_SUMMARY"
